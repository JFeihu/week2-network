[project]
name = "week2-network"
version = "0.1.0"
description = "W2：网络基础 + asyncio（Scratch 项目）"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
# 不是要发布的包，只是一组实验脚本
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"   # async def 测试不用每个都加 @pytest.mark.asyncio
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]      # 让 tests/ 里能 import 项目根目录的模块
